<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Luxury Intel: How it works</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter+Tight:wght@500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=block" rel="stylesheet">
<style>
/* Every frame is a pure function of time: __renderAt(t) sets inline styles. */
:root {
  --bg: #F7F3EA; --ink: #17140F; --muted: #776F62;
  --gold: #A87C12; --gold-bright: #E2BE55; --gold-deep: #8B6914;
  --paper: #FFFFFF; --line: rgba(23,20,15,0.12);
  --sans: 'Inter Tight', system-ui, sans-serif;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
body { color: var(--ink); font-family: var(--sans); position: relative; }
#bg { position: absolute; inset: 0;
  background:
    radial-gradient(1100px 700px at 50% 42%, rgba(226,190,85,0.20), transparent 70%),
    repeating-linear-gradient(0deg, rgba(23,20,15,0.035) 0 1px, transparent 1px 80px),
    repeating-linear-gradient(90deg, rgba(23,20,15,0.035) 0 1px, transparent 1px 80px),
    var(--bg); }
#header { position: absolute; top: 48px; left: 96px; right: 96px; display: flex; justify-content: space-between; align-items: baseline; }
.wordmark { font-family: var(--serif); font-weight: 700; font-size: 40px; color: var(--gold-deep); letter-spacing: 0.02em; }
.wordmark i { color: var(--ink); font-weight: 600; }
#chapter { font-family: var(--mono); font-size: 22px; color: var(--muted); letter-spacing: 0.1em; }
#progress { position: absolute; top: 112px; left: 96px; right: 96px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
#progress > div { height: 100%; width: 0; background: var(--gold-deep); }

#stage { position: absolute; top: 150px; left: 96px; right: 96px; height: 700px; }
.scene { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; }
.kicker { font-family: var(--mono); font-size: 26px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--gold-deep); margin-bottom: 18px; }
.heading { font-family: var(--serif); font-weight: 700; font-size: 76px; line-height: 1.05; margin-bottom: 52px; }
.el { opacity: 0; will-change: transform, opacity; }

/* intro / outro */
.center { align-items: center; text-align: center; }
.big { font-family: var(--serif); font-weight: 700; font-size: 200px; line-height: 1; color: var(--ink); }
.big em { color: var(--gold-deep); }
.sub { font-size: 44px; font-weight: 600; color: var(--muted); margin-top: 36px; }
.url { font-family: var(--mono); font-size: 64px; font-weight: 700; color: var(--gold-deep); margin-top: 40px; padding: 18px 40px; border: 3px solid var(--gold-deep); border-radius: 18px; }
.rule { width: 0; height: 4px; background: var(--gold-bright); margin: 28px auto 0; }

/* flow */
.flow { display: flex; align-items: stretch; gap: 0; }
.step { flex: 1; background: var(--paper); border: 2px solid var(--line); border-radius: 22px; padding: 34px 26px; text-align: center; box-shadow: 0 10px 30px rgba(23,20,15,0.06); }
.step .n { font-family: var(--mono); font-size: 22px; color: var(--muted); }
.step h3 { font-size: 44px; font-weight: 800; margin: 10px 0 10px; }
.step p { font-size: 26px; color: var(--muted); font-weight: 600; line-height: 1.25; }
.step.on { border-color: var(--gold-deep); background: #FFF8E4; }
.arrow { width: 56px; display: flex; align-items: center; justify-content: center; font-size: 46px; color: var(--gold); font-weight: 800; }

/* cards */
.grid { display: grid; gap: 28px; }
.grid.c2 { grid-template-columns: 1fr 1fr; }
.grid.c3 { grid-template-columns: 1fr 1fr 1fr; }
.card { background: var(--paper); border: 2px solid var(--line); border-left: 10px solid var(--gold-bright); border-radius: 18px; padding: 30px 36px; box-shadow: 0 10px 30px rgba(23,20,15,0.06); }
.card h3 { font-size: 46px; font-weight: 800; margin-bottom: 10px; }
.card p { font-size: 29px; color: var(--muted); font-weight: 600; line-height: 1.3; }
.card p code, .card h3 code { font-family: var(--mono); font-size: 0.9em; }

/* funnel */
.funnel { display: flex; flex-direction: column; gap: 22px; align-items: center; }
.frow { display: flex; align-items: center; gap: 36px; width: 100%; }
.bar { height: 104px; border-radius: 16px; background: var(--gold-bright); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 52px; font-weight: 700; color: var(--ink); flex: none; }
.frow:last-child .bar { background: var(--ink); color: var(--gold-bright); }
.flabel { font-size: 36px; font-weight: 700; }
.barwrap { width: 900px; display: flex; justify-content: center; flex: none; }

/* hub */
.hub { display: flex; align-items: center; gap: 70px; }
.core { flex: none; width: 420px; height: 420px; border-radius: 50%; background: var(--ink); color: var(--gold-bright); display: flex; align-items: center; justify-content: center; text-align: center; font-family: var(--serif); font-weight: 700; font-size: 58px; line-height: 1.05; padding: 50px; box-shadow: 0 0 0 18px rgba(226,190,85,0.35); }
.hub .grid { flex: 1; }
.hub .card { padding: 24px 30px; }
.hub .card h3 { font-size: 40px; }
.hub .card p { font-size: 26px; }

#captions { position: absolute; left: 160px; right: 160px; bottom: 54px; height: 120px; display: flex; align-items: center; justify-content: center; text-align: center; }
#captions .line { font-size: 40px; font-weight: 700; line-height: 1.3; background: rgba(23,20,15,0.88); color: #F7F3EA; padding: 12px 26px; border-radius: 14px; }
#captions .w.on { color: var(--gold-bright); }
#fade { position: absolute; inset: 0; background: var(--bg); opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="header"><div class="wordmark">Luxury <i>Intel</i></div><div id="chapter"></div></div>
<div id="progress"><div></div></div>
<div id="stage"></div>
<div id="captions"></div>
<div id="fade"></div>
<script>
let S = { scenes: [], total: 1 };
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const code = s => esc(s).replace(/((?:data|\/)[\w./-]*\.(?:json|txt)|\/llms\.txt|\/methodology|\/analytics)/g, '<code>$1</code>');
const easeOut = x => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);

function build(sc, i) {
  const v = sc.visual, d = document.createElement('div');
  d.className = 'scene';
  const head = v.kicker ? `<div class="kicker el">${esc(v.kicker)}</div><div class="heading el">${esc(v.heading)}</div>` : '';
  if (v.kind === 'intro') {
    d.classList.add('center');
    d.innerHTML = `<div class="kicker el">${esc(v.kicker)}</div><div class="big el">Luxury <em>Intel</em></div><div class="rule"></div><div class="sub el">${esc(v.sub)}</div>`;
  } else if (v.kind === 'outro') {
    d.classList.add('center');
    d.innerHTML = `<div class="big el">Luxury <em>Intel</em></div><div class="sub el">Sources in. Seven stories per topic out.</div><div class="url el">${esc(v.sub)}</div>`;
  } else if (v.kind === 'flow') {
    d.innerHTML = head + `<div class="flow">${v.steps.map((s, k) =>
      (k ? '<div class="arrow el">→</div>' : '') +
      `<div class="step el" data-step="${k}"><div class="n">${String(k + 1).padStart(2, '0')}</div><h3>${esc(s.h)}</h3><p>${esc(s.p)}</p></div>`).join('')}</div>`;
  } else if (v.kind === 'cards') {
    const cols = v.items.length % 3 === 0 ? 'c3' : 'c2';
    d.innerHTML = head + `<div class="grid ${cols}">${v.items.map(s => `<div class="card el"><h3>${code(s.h)}</h3><p>${code(s.p)}</p></div>`).join('')}</div>`;
  } else if (v.kind === 'funnel') {
    const widths = [900, 640, 380, 200];
    d.innerHTML = head + `<div class="funnel">${v.rows.map((r, k) =>
      `<div class="frow el"><div class="barwrap"><div class="bar" style="width:${widths[k]}px">${esc(r.n)}</div></div><div class="flabel">${esc(r.label)}</div></div>`).join('')}</div>`;
  } else if (v.kind === 'hub') {
    d.innerHTML = head + `<div class="hub"><div class="core el">${esc(v.center)}</div><div class="grid c2">${v.items.map(s => `<div class="card el"><h3>${esc(s.h)}</h3><p>${esc(s.p)}</p></div>`).join('')}</div></div>`;
  }
  return d;
}

/** Caption chunks: up to 8 words, broken early after sentence punctuation. */
function chunks(words) {
  const out = []; let cur = [];
  for (const w of words) {
    cur.push(w);
    if (cur.length >= 8 || (/[.?!]$/.test(w.text) && cur.length >= 3)) { out.push(cur); cur = []; }
  }
  if (cur.length) out.push(cur);
  // A 1–2 word tail reads badly on its own: fold it into the previous line.
  for (let i = out.length - 1; i > 0; i--) if (out[i].length <= 2 && out[i - 1].length <= 9) { out[i - 1].push(...out[i]); out.splice(i, 1); }
  return out;
}

window.__setup = data => {
  S = data;
  const stage = document.getElementById('stage');
  S.scenes.forEach((sc, i) => {
    sc.el = build(sc, i);
    stage.appendChild(sc.el);
    sc.items = [...sc.el.querySelectorAll('.el')];
    sc.steps = [...sc.el.querySelectorAll('.step')];
    sc.rule = sc.el.querySelector('.rule');
    sc.chunks = chunks(sc.words);
  });
};

/** Elements appear in order across the first ~60% of the scene's narration. */
window.__renderAt = t => {
  document.querySelector('#progress > div').style.width = `${(t / S.total) * 100}%`;
  let active = S.scenes.findIndex(sc => t >= sc.start && t < sc.end);
  if (active < 0) active = S.scenes.length - 1;
  S.scenes.forEach((sc, i) => { sc.el.style.display = i === active ? 'flex' : 'none'; });
  const sc = S.scenes[active], lt = t - sc.start, dur = sc.end - sc.start;
  const n = sc.items.length;
  const span = Math.max(0.6, Math.min(dur * 0.6, 0.55 * n));
  sc.items.forEach((el, k) => {
    // Kicker and heading land together and early; the rest is spread out.
    const at = k < 2 ? 0.05 + k * 0.12 : 0.35 + ((k - 2) / Math.max(1, n - 2)) * span;
    const p = easeOut((lt - at) / 0.45);
    el.style.opacity = p;
    el.style.transform = `translateY(${(1 - p) * 34}px)`;
  });
  if (sc.rule) sc.rule.style.width = `${easeOut((lt - 0.4) / 0.8) * 520}px`;
  // Flow scenes: the step being "reached" glows gold.
  if (sc.steps.length) {
    const reach = (lt - 0.35) / (span || 1) * (sc.steps.length);
    sc.steps.forEach((el, k) => el.classList.toggle('on', Math.floor(Math.min(reach, sc.steps.length - 0.01) / 1) === k && lt > 0.35));
  }
  const kick = sc.visual.kicker && /^\d\d/.test(sc.visual.kicker) ? sc.visual.kicker.slice(0, 2) + ' / ' + S.scenes.filter(s => /^\d\d/.test(s.visual.kicker || '')).length : '';
  document.getElementById('chapter').textContent = kick || 'HOW IT WORKS';
  // Quick dip at each cut.
  document.getElementById('fade').style.opacity = active === 0 ? Math.max(0, 1 - lt / 0.4) : Math.max(0, 0.6 * (1 - lt / 0.25));

  const cap = document.getElementById('captions');
  const ch = sc.chunks.find(c => lt + sc.start < c[c.length - 1].end + 0.05 && t >= c[0].start - 0.05) || null;
  if (!ch) { cap.innerHTML = ''; return; }
  cap.innerHTML = `<div class="line">${ch.map(w => `<span class="w${t >= w.start && t < w.end ? ' on' : ''}">${esc(w.text)}</span>`).join(' ')}</div>`;
};

/** Text must stay inside the stage / frame. */
window.__checkLayout = () => {
  const bad = [];
  const stage = document.getElementById('stage').getBoundingClientRect();
  S.scenes.forEach((sc, i) => {
    S.scenes.forEach((o, j) => { o.el.style.display = j === i ? 'flex' : 'none'; });
    sc.items.forEach(el => { el.style.opacity = 1; el.style.transform = 'none'; });
    for (const el of sc.el.querySelectorAll('.el, h3, p')) {
      const r = el.getBoundingClientRect();
      if (r.top < stage.top - 1 || r.bottom > stage.bottom + 1 || r.left < stage.left - 1 || r.right > stage.right + 1)
        bad.push(`scene ${i} (${sc.visual.kind}): "${el.textContent.slice(0, 40)}" ${Math.round(r.left)},${Math.round(r.top)} → ${Math.round(r.right)},${Math.round(r.bottom)}`);
      if (el.scrollWidth > el.clientWidth + 2 && el.tagName !== 'DIV') bad.push(`scene ${i}: text overflows "${el.textContent.slice(0, 40)}"`);
    }
  });
  return bad;
};
</script>
</body>
</html>
