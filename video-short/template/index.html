<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Luxury Intel in 60 Seconds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter+Tight:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&family=Noto+Color+Emoji&display=block" rel="stylesheet">
<style>
/*
 * Every frame is a pure function of time: renderAt(t) sets inline styles.
 * No CSS transitions or animations, so headless capture is deterministic.
 */
:root {
  /* Light theme (owner, 2026-10-05): cream page, ink text, site gold. */
  --bg: #F7F3EA;
  --ink: #17140F;
  --muted: #776F62;
  --gold: #A87C12;        /* accent text on cream */
  --gold-bright: #E2BE55; /* fills, highlights */
  --gold-deep: #8B6914;
  --red: #C8372B;
  --teal: #4FD1C5;
  --paper: #FFFFFF;
  --line: rgba(23,20,15,0.12);
  --sans: 'Inter Tight', system-ui, sans-serif;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --emoji: 'Noto Color Emoji', 'Segoe UI Emoji', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
/* Size comes from the format class: portrait (mobile) or landscape (desktop). */
html, body { overflow: hidden; background: var(--bg); }
body.portrait { width: 1080px; height: 1920px; }
body.landscape { width: 1920px; height: 1080px; }
body { color: var(--ink); font-family: var(--sans); position: relative; font-variant-numeric: lining-nums; }

/* Backdrop: faint grid + warm glow. Cheap to rasterize (no filters). */
#bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(900px 700px at 50% 38%, rgba(226,190,85,0.22), transparent 70%),
    repeating-linear-gradient(0deg, rgba(23,20,15,0.035) 0 1px, transparent 1px 90px),
    repeating-linear-gradient(90deg, rgba(23,20,15,0.035) 0 1px, transparent 1px 90px),
    var(--bg);
}

/* Header: brand + issue */
#header {
  position: absolute; top: 120px; left: 72px; right: 72px;
  display: flex; justify-content: space-between; align-items: baseline;
}
.wordmark { font-family: var(--serif); font-weight: 700; font-size: 46px; letter-spacing: 0.02em; color: var(--gold-deep); }
.wordmark i { font-style: italic; color: var(--ink); font-weight: 600; }
.issue { font-family: var(--mono); font-size: 26px; color: var(--muted); letter-spacing: 0.08em; }
#progress { position: absolute; top: 196px; left: 72px; right: 72px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
#progress > div { height: 100%; width: 0; background: var(--gold-deep); }

/* Stage: where scenes live. Kept above the bottom ~420px (platform UI). */
#stage { position: absolute; top: 260px; left: 72px; right: 72px; height: 1000px; }
.scene { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; transform-origin: 50% 50%; }

/* Captions */
#captions {
  position: absolute; top: 1300px; left: 60px; right: 60px; height: 190px;
  display: flex; align-items: center; justify-content: center; text-align: center;
  font-family: var(--sans); font-weight: 900; font-size: 74px; line-height: 1.05;
  text-transform: uppercase; letter-spacing: -0.01em;
  color: var(--ink);
}
#captions span { margin: 0 0.06em; padding: 0 0.1em; border-radius: 10px; }
#captions .on { background: var(--gold-bright); }

#flash { position: absolute; inset: 0; background: var(--ink); opacity: 0; pointer-events: none; }

/* ── Scene kinds ───────────────────────────── */
.kicker { font-family: var(--mono); font-size: 32px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-deep); margin-top: 40px; }
.big { font-family: var(--sans); font-weight: 900; font-size: 120px; line-height: 0.98; letter-spacing: -0.03em; }
.big .w { display: inline-block; margin: 0 0.12em; }

.headline-card {
  background: var(--paper); color: #141414; width: 100%; max-width: 920px; padding: 56px 56px 48px; text-align: left;
  border-radius: 6px; border: 2px solid var(--ink); box-shadow: 0 24px 60px rgba(23,20,15,0.18);
}
.headline-card .src { font-family: var(--mono); font-weight: 700; font-size: 26px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-deep); border-bottom: 2px solid #1414141f; padding-bottom: 18px; margin-bottom: 26px; }
.headline-card .hl { font-family: var(--serif); font-weight: 700; font-size: 84px; line-height: 1.02; }
.headline-card .stamp { display: inline-block; margin-top: 30px; font-family: var(--mono); font-size: 22px; color: #fff; background: #141414; padding: 8px 14px; letter-spacing: 0.1em; }

.stat-num { font-family: var(--sans); font-weight: 900; font-size: 260px; line-height: 0.9; letter-spacing: -0.05em; color: var(--gold-deep); }
.stat-label { font-family: var(--sans); font-weight: 700; font-size: 54px; line-height: 1.1; margin-top: 30px; max-width: 900px; }

.list { width: 100%; max-width: 900px; text-align: left; }
.list .item { display: flex; align-items: center; gap: 28px; font-weight: 800; font-size: 72px; line-height: 1.05; margin: 22px 0; }
.list .item b { font-family: var(--mono); font-size: 40px; color: var(--ink); background: var(--gold-bright); border-radius: 50%; min-width: 72px; height: 72px; display: grid; place-items: center; }
.list-title { font-family: var(--mono); font-size: 32px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-deep); margin-bottom: 30px; align-self: flex-start; }

.versus { display: flex; flex-direction: column; gap: 34px; width: 100%; max-width: 920px; }
.vs-card { border-radius: 10px; padding: 40px 44px; text-align: left; }
.vs-card .lab { font-family: var(--mono); font-weight: 700; font-size: 28px; letter-spacing: 0.14em; margin-bottom: 14px; }
.vs-card .txt { font-weight: 900; font-size: 82px; line-height: 1; letter-spacing: -0.02em; }
.vs-a { background: rgba(200,55,43,0.07); border: 3px solid var(--red); }
.vs-a .lab { color: var(--red); }
.vs-b { background: rgba(226,190,85,0.16); border: 3px solid var(--gold-deep); }
.vs-b .lab { color: var(--gold-deep); }
.vs-mid { font-family: var(--serif); font-style: italic; font-size: 60px; color: var(--muted); text-align: center; margin: -10px 0; }

.meme { background: #fff; color: #0f0f0f; width: 100%; max-width: 920px; padding: 60px 56px; border-radius: 8px; text-align: left; border: 2px solid var(--ink); box-shadow: 0 24px 60px rgba(23,20,15,0.18); }
.meme .line { font-family: var(--sans); font-weight: 800; font-size: 68px; line-height: 1.12; margin: 14px 0; }
.meme .line.last { color: #0f0f0f; }

.code { width: 100%; max-width: 940px; background: #111318; border: 2px solid #262a33; border-radius: 14px; text-align: left; overflow: hidden; box-shadow: 0 24px 60px rgba(23,20,15,0.25); }
.code .bar { display: flex; align-items: center; gap: 12px; padding: 20px 26px; background: #181b22; border-bottom: 2px solid #262a33; }
.code .dot { width: 20px; height: 20px; border-radius: 50%; }
.code .fname { font-family: var(--mono); font-size: 26px; color: var(--muted); margin-left: 16px; }
.code pre { font-family: var(--mono); font-weight: 500; font-size: 44px; line-height: 1.45; padding: 34px 36px 40px; white-space: pre-wrap; word-break: break-word; color: #E6E1D6; }
.code .kw { color: #FF7AB2; } .code .num { color: var(--gold); } .code .str { color: #9FE870; } .code .com { color: #6B7280; font-style: italic; } .code .fn { color: var(--teal); }
.cursor { display: inline-block; width: 0.55em; height: 1em; background: var(--gold); vertical-align: -0.12em; }

.bars { width: 100%; max-width: 920px; text-align: left; }
.bars .row { margin: 26px 0; }
.bars .lab { font-weight: 800; font-size: 46px; margin-bottom: 12px; display: flex; justify-content: space-between; }
.bars .lab span:last-child { color: var(--gold-deep); font-family: var(--mono); }
.bars .track { height: 64px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bars .fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--gold-deep), var(--gold-bright)); }
.bars .cap { font-family: var(--mono); font-size: 30px; color: var(--muted); margin-top: 30px; letter-spacing: 0.06em; }

.emoji { font-family: var(--emoji); font-size: 360px; line-height: 1; }
.emoji-cap { font-weight: 900; font-size: 92px; line-height: 1; margin-top: 40px; letter-spacing: -0.02em; }

.k-outro .follow { font-family: var(--sans); font-weight: 800; font-size: 64px; line-height: 1.05; }
.k-outro .url { font-family: var(--mono); font-weight: 700; font-size: 60px; margin-top: 36px; color: var(--ink); background: var(--gold-bright); padding: 20px 38px; border-radius: 10px; }

/* Intro: quick dramatic entrance. */
/* Full-bleed ink band holding the whole title block; it wipes in from the left. */
.k-intro .band { position: relative; width: 140%; padding: 80px 0 70px; background: var(--ink); display: flex; flex-direction: column; align-items: center; transform-origin: 0 50%; }
.k-intro .mark { position: relative; font-family: var(--serif); font-weight: 700; font-size: 150px; line-height: 0.92; color: var(--gold-bright); }
.k-intro .mark i { color: var(--bg); font-weight: 600; }
.k-intro .hot { position: relative; display: inline-block; margin-top: 56px; font-family: var(--sans); font-weight: 900; font-size: 64px; letter-spacing: 0.02em; color: var(--paper); background: var(--red); padding: 12px 30px; border-radius: 8px; text-transform: uppercase; }
.k-intro .sec { position: relative; margin-top: 30px; font-family: var(--mono); font-weight: 700; font-size: 38px; letter-spacing: 0.16em; color: var(--gold-bright); }

/* Brand marks: logo (brand color), wordmark (typeset name) or icon. */
.marks { display: flex; gap: 46px; align-items: center; justify-content: center; margin-bottom: 44px; }
.mk { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.mk svg { width: 120px; height: 120px; display: block; }
.mk.icon svg { stroke: var(--ink); stroke-width: 1.6; }
.mk .nm { font-family: var(--mono); font-weight: 700; font-size: 24px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.mk.wordmark .wm { font-family: var(--sans); font-weight: 900; font-size: 60px; letter-spacing: -0.02em; color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 18px 30px; background: var(--paper); }
.vs-card .vs-mark { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
.vs-card .vs-mark svg { width: 64px; height: 64px; }
.vs-card .vs-mark .wm { font-family: var(--sans); font-weight: 900; font-size: 34px; color: var(--ink); border: 2px solid var(--ink); border-radius: 10px; padding: 6px 14px; background: var(--paper); }

/* ── Landscape (desktop, 1920x1080) ─────────── */
body.landscape #header { top: 46px; left: 100px; right: 100px; }
body.landscape #progress { top: 112px; left: 100px; right: 100px; }
body.landscape #stage { top: 150px; left: 160px; right: 160px; height: 690px; }
body.landscape #captions { top: 862px; left: 140px; right: 140px; height: 150px; font-size: 62px; }
body.landscape .big { font-size: 112px; }
body.landscape .headline-card { max-width: 1300px; }
body.landscape .list { max-width: 1000px; }
body.landscape .list-title { align-self: center; width: 100%; max-width: 1000px; text-align: left; }
body.landscape .meme { max-width: 1250px; }
body.landscape .code, body.landscape .bars { max-width: 1300px; }
body.landscape .versus { flex-direction: row; align-items: stretch; max-width: 1560px; gap: 30px; }
body.landscape .vs-card { flex: 1; }
body.landscape .vs-mid { align-self: center; margin: 0; }
body.landscape .stat-num { font-size: 230px; }
body.landscape .stat-label { max-width: 1300px; }
body.landscape .emoji { font-size: 250px; }
body.landscape .emoji-cap { margin-top: 24px; }
body.landscape .kicker { margin-top: 28px; }
body.landscape .k-intro .mark { font-size: 130px; }
body.landscape .k-intro .band { width: 130%; padding: 60px 0 54px; }
body.landscape .k-intro .hot { margin-top: 40px; }
body.landscape .marks { margin-bottom: 30px; }
body.landscape .mk svg { width: 100px; height: 100px; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="header">
  <div class="wordmark">Luxury <i>Intel</i></div>
  <div class="issue" id="issue"></div>
</div>
<div id="progress"><div></div></div>
<div id="stage"></div>
<div id="captions"></div>
<div id="flash"></div>

<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const easeOutBack = x => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let DATA = null;
let LAYOUT = null;

/*
 * Safe areas per format. The spill check (window.__checkLayout) requires every
 * visible piece of text to sit inside these boxes. Portrait keeps clear of the
 * Shorts/Reels/TikTok UI at the bottom; landscape keeps a title-safe margin.
 */
const LAYOUTS = {
  portrait: { w: 1080, h: 1920, codeW: 860, fitH: 600,
    stage: { l: 56, t: 230, r: 1024, b: 1280 }, caps: { l: 40, t: 1285, r: 1040, b: 1500 }, header: { l: 56, t: 90, r: 1024, b: 215 } },
  landscape: { w: 1920, h: 1080, codeW: 1220, fitH: 420,
    stage: { l: 110, t: 140, r: 1810, b: 850 }, caps: { l: 110, t: 852, r: 1810, b: 1025 }, header: { l: 80, t: 30, r: 1840, b: 125 } },
};
let SCENES = [];   // { el, scene, update(lt, D) }
let CHUNKS = [];   // caption chunks: { words: [{text,start,end}], start, end }

/** Split "$11.6B" into { pre: "$", num: 11.6, dec: 1, post: "B" } for the count-up. */
function parseStat(s) {
  const m = String(s).match(/^(.*?)(\d[\d,]*(?:\.\d+)?)(.*)$/);
  if (!m) return null;
  const n = m[2].replace(/,/g, '');
  return { pre: m[1], num: Number(n), dec: (n.split('.')[1] || '').length, post: m[3], commas: m[2].includes(',') };
}
function fmtStat(p, v) {
  let s = v.toFixed(p.dec);
  if (p.commas) s = Number(s).toLocaleString('en-US', { minimumFractionDigits: p.dec, maximumFractionDigits: p.dec });
  return p.pre + s + p.post;
}

/** Marks row for a scene (logos in brand color, wordmarks, icons). */
function marksHtml(marks) {
  if (!marks || !marks.length) return '';
  return `<div class="marks">${marks.map(m =>
    m.kind === 'wordmark' ? `<div class="mk wordmark"><div class="wm">${esc(m.name)}</div></div>`
    : m.kind === 'logo' ? `<div class="mk logo">${m.svg}<div class="nm">${esc(m.name)}</div></div>`
    : `<div class="mk icon">${m.svg}</div>`).join('')}</div>`;
}
function vsMarkHtml(m) {
  if (!m) return '';
  return `<div class="vs-mark">${m.kind === 'wordmark' ? `<span class="wm">${esc(m.name)}</span>` : m.svg}</div>`;
}

function highlightCode(line) {
  let h = esc(line);
  h = h.replace(/(\/\/.*)$/, '<span class="com">$1</span>');
  h = h.replace(/(&quot;.*?&quot;|'.*?')/g, '<span class="str">$1</span>');
  h = h.replace(/\b(if|else|while|for|const|let|return|await|async|new|function|true|false|null)\b/g, '<span class="kw">$1</span>');
  h = h.replace(/\b(\d+(?:\.\d+)?)\b(?![^<]*>)/g, '<span class="num">$1</span>');
  h = h.replace(/\b([a-zA-Z_]\w*)(?=\()/g, '<span class="fn">$1</span>');
  return h;
}

/** Shrink font-size until the element fits its box. Runs once at setup. */
function fit(el, maxW, maxH, min = 28) {
  let fs = parseFloat(getComputedStyle(el).fontSize);
  while ((el.scrollWidth > maxW || el.scrollHeight > maxH) && fs > min) {
    fs -= 2; el.style.fontSize = fs + 'px';
  }
}

function build(scene) {
  const v = scene.visual;
  const el = document.createElement('div');
  el.className = 'scene k-' + v.kind; // prefixed: .meme/.code etc. are card classes
  let update = () => {};
  const brandMarks = (scene.marks || []).filter(m => m.kind !== 'icon');
  const rowMarks = ['versus', 'intro', 'outro'].includes(v.kind) ? [] : (v.kind === 'emoji' ? brandMarks : scene.marks || []);

  switch (v.kind) {
    case 'title': {
      el.innerHTML = `<div class="big">${v.big.split(/\s+/).map(w => `<span class="w">${esc(w)}</span>`).join(' ')}</div>` +
        (v.small ? `<div class="kicker">${esc(v.small)}</div>` : '');
      const ws = [...el.querySelectorAll('.w')], k = el.querySelector('.kicker');
      update = (lt, D) => {
        ws.forEach((w, i) => { const p = easeOutBack((lt - i * 0.06) / 0.22); w.style.opacity = clamp((lt - i * 0.06) / 0.08); w.style.transform = `translateY(${(1 - p) * 60}px)`; });
        if (k) k.style.opacity = clamp((lt - Math.min(2.5, D * 0.3)) / 0.3);
      };
      break;
    }
    case 'headline': {
      el.innerHTML = `<div class="headline-card"><div class="src">${esc(v.small)}</div><div class="hl">${esc(v.big)}</div><div class="stamp">THIS WEEK</div></div>`;
      const c = el.firstChild, st = el.querySelector('.stamp');
      update = (lt, D) => {
        const p = easeOutBack(lt / 0.32); c.style.transform = `translateY(${(1 - p) * 500}px) rotate(${-2.5 * p}deg)`;
        const q = easeOutBack((lt - D * 0.4) / 0.2); st.style.opacity = clamp((lt - D * 0.4) / 0.05); st.style.transform = `scale(${1.6 - 0.6 * q})`;
      };
      break;
    }
    case 'stat': {
      el.innerHTML = `<div class="stat-num"></div><div class="stat-label">${esc(v.small)}</div>`;
      const n = el.querySelector('.stat-num'), lab = el.querySelector('.stat-label'), p = parseStat(v.big);
      n.textContent = v.big;
      update = lt => {
        if (p) n.textContent = fmtStat(p, p.num * easeOut(lt / 0.7));
        n.style.transform = `scale(${0.85 + 0.15 * easeOutBack(lt / 0.3)})`;
        lab.style.opacity = clamp((lt - 0.3) / 0.2);
      };
      break;
    }
    case 'list': {
      el.innerHTML = (v.big ? `<div class="list-title">${esc(v.big)}</div>` : '') +
        `<div class="list">${v.items.map((it, i) => `<div class="item"><b>${i + 1}</b><span>${esc(it)}</span></div>`).join('')}</div>`;
      const its = [...el.querySelectorAll('.item')];
      update = (lt, D) => {
        // Spread items across the scene so they arrive roughly as the narration reaches them.
        const step = (D * 0.75) / Math.max(1, its.length);
        its.forEach((it, i) => { const at = 0.2 + i * step; const q = easeOutBack((lt - at) / 0.25); it.style.opacity = clamp((lt - at) / 0.1); it.style.transform = `translateX(${(1 - q) * -120}px)`; });
      };
      break;
    }
    case 'versus': {
      // "LABEL: text" (older scripts used a dash separator).
      const [a, b] = [0, 1].map(i => { const s = String(v.items[i] || ''); const k = s.match(/^([^:]{1,40}):\s+(.+)$/) || s.match(/^(.+?)\s+[—–-]\s+(.+)$/); return k ? { lab: k[1], txt: k[2] } : { lab: '', txt: s }; });
      const bm = brandMarks;
      el.innerHTML = `<div class="versus"><div class="vs-card vs-a">${vsMarkHtml(bm[0])}<div class="lab">${esc(a.lab)}</div><div class="txt">${esc(a.txt)}</div></div>` +
        `<div class="vs-mid">vs.</div><div class="vs-card vs-b">${vsMarkHtml(bm[1])}<div class="lab">${esc(b.lab)}</div><div class="txt">${esc(b.txt)}</div></div></div>` +
        (v.small ? `<div class="kicker">${esc(v.small)}</div>` : '');
      const A = el.querySelector('.vs-a'), B = el.querySelector('.vs-b'), M = el.querySelector('.vs-mid');
      update = (lt, D) => {
        const tb = D * 0.45;
        // Fade + short slide. Parking a card off-frame left a sliver visible at
        // the edge until its entrance (caught by the spill check).
        A.style.opacity = clamp(lt / 0.12);
        A.style.transform = `translateX(${(1 - easeOutBack(lt / 0.25)) * -160}px)`;
        M.style.opacity = clamp((lt - tb + 0.15) / 0.1);
        B.style.opacity = clamp((lt - tb) / 0.12);
        B.style.transform = `translateX(${(1 - easeOutBack((lt - tb) / 0.25)) * 160}px)`;
      };
      break;
    }
    case 'meme': {
      el.innerHTML = `<div class="meme">${v.items.map((l, i, arr) => `<div class="line${i === arr.length - 1 ? ' last' : ''}">${esc(l)}</div>`).join('')}</div>`;
      const ls = [...el.querySelectorAll('.line')], card = el.firstChild;
      update = (lt, D) => {
        card.style.transform = `scale(${0.9 + 0.1 * easeOutBack(lt / 0.2)})`;
        // Setup lines together, punchline lands later.
        const n = ls.length, punchAt = D * 0.55;
        ls.forEach((l, i) => { const at = i === n - 1 ? punchAt : (i * punchAt * 0.6) / Math.max(1, n - 2); l.style.opacity = clamp((lt - at) / 0.1); });
      };
      break;
    }
    case 'code': {
      // Long "code; // comment" lines would force a tiny font. Move the comment
      // onto its own line above the statement, keeping the indentation.
      const lines = v.items.map(String).flatMap(l => {
        const m = l.match(/^(\s*)(.*?);?\s*(\/\/.*)$/);
        return l.length > 30 && m && m[2].trim() ? [m[1] + m[3], m[1] + m[2] + ';'] : [l];
      });
      el.innerHTML = `<div class="code"><div class="bar"><span class="dot" style="background:#FF5F57"></span><span class="dot" style="background:#FEBC2E"></span><span class="dot" style="background:#28C840"></span><span class="fname">${esc(v.small || 'pricing.js')}</span></div><pre></pre></div>`;
      const pre = el.querySelector('pre'), full = lines.join('\n');
      // Size the font to the longest line so nothing wraps (mono glyph ~0.6em wide).
      const longest = Math.max(...lines.map(l => l.length), 1);
      pre.style.fontSize = Math.min(44, Math.floor(LAYOUT.codeW / (longest * 0.6))) + 'px';
      pre.style.whiteSpace = 'pre';
      update = (lt, D) => {
        const n = Math.floor(full.length * clamp(lt / Math.max(0.6, D * 0.7)));
        const shown = full.slice(0, n).split('\n');
        pre.innerHTML = shown.map(highlightCode).join('\n') + (n < full.length || Math.floor(lt * 2.5) % 2 === 0 ? '<span class="cursor"></span>' : '');
      };
      break;
    }
    case 'bars': {
      const max = Math.max(...v.bars.map(b => Math.abs(b.value)), 1e-9);
      el.innerHTML = `<div class="bars">${v.bars.map(b => `<div class="row"><div class="lab"><span>${esc(b.label)}</span><span>${esc(b.display)}</span></div><div class="track"><div class="fill" data-w="${(Math.abs(b.value) / max) * 100}"></div></div></div>`).join('')}` +
        (v.small ? `<div class="cap">${esc(v.small)}</div>` : '') + `</div>`;
      const fs = [...el.querySelectorAll('.fill')];
      update = (lt, D) => fs.forEach((f, i) => { f.style.width = (Number(f.dataset.w) * easeOut((lt - i * D * 0.2) / 0.8)) + '%'; });
      break;
    }
    case 'emoji': {
      el.innerHTML = `<div class="emoji">${esc(v.emoji || '💀')}</div>` + (v.big ? `<div class="emoji-cap">${esc(v.big)}</div>` : '');
      const e = el.querySelector('.emoji'), c = el.querySelector('.emoji-cap');
      update = lt => {
        e.style.transform = `scale(${easeOutBack(lt / 0.28)}) rotate(${Math.sin(lt * 6) * 4}deg)`;
        if (c) c.style.opacity = clamp((lt - 0.2) / 0.12);
      };
      break;
    }
    case 'outro': {
      el.innerHTML = `<div class="follow">Follow the full digest at</div><div class="url">luxury-intel.com</div>`;
      const parts = [...el.children];
      update = lt => parts.forEach((p, i) => { p.style.opacity = clamp((lt - i * 0.2) / 0.2); p.style.transform = `translateY(${(1 - easeOutBack((lt - i * 0.2) / 0.3)) * 40}px)`; });
      break;
    }
    case 'intro': {
      // Ink bar wipes in, wordmark slams down with a small shake, then the stamp.
      el.innerHTML = `<div class="band"><div class="mark">Luxury <i>Intel</i></div><div class="hot">Weekly hot take</div><div class="sec">IN 60 SECONDS</div></div>`;
      const bar = el.firstChild, [mark, hot, sec] = bar.children;
      update = (lt, D) => {
        bar.style.transform = `scaleX(${easeOut(lt / 0.25)})`;
        const m = clamp((lt - 0.15) / 0.22);
        const shake = lt > 0.37 && lt < 0.6 ? Math.sin(lt * 90) * 8 * (1 - (lt - 0.37) / 0.23) : 0;
        mark.style.opacity = clamp((lt - 0.15) / 0.06);
        mark.style.transform = `translateX(${shake}px) scale(${1.8 - 0.8 * easeOut(m)})`;
        const h = easeOutBack((lt - Math.min(0.9, D * 0.3)) / 0.25);
        hot.style.opacity = clamp((lt - Math.min(0.9, D * 0.3)) / 0.05);
        hot.style.transform = `rotate(${-4 * h}deg) scale(${2 - h})`;
        sec.style.opacity = clamp((lt - Math.min(1.3, D * 0.45)) / 0.2);
      };
      break;
    }
  }
  if (rowMarks.length) {
    el.insertAdjacentHTML('afterbegin', marksHtml(rowMarks));
    const row = el.querySelector('.marks'), inner = update;
    update = (lt, D) => { inner(lt, D); row.style.opacity = clamp((lt - 0.1) / 0.2); row.style.transform = `translateY(${(1 - easeOutBack((lt - 0.1) / 0.3)) * -40}px)`; };
  }
  return { el, scene, update };
}

function buildCaptions(scenes) {
  const chunks = [];
  for (const s of scenes) {
    let cur = [];
    const flush = () => { if (cur.length) chunks.push({ words: cur, start: cur[0].start, end: cur[cur.length - 1].end }); cur = []; };
    for (const w of s.words) {
      cur.push(w);
      if (cur.length >= 3 || /[.,!?;:]$/.test(w.text)) flush();
    }
    flush();
  }
  return chunks;
}

window.__setup = async (data) => {
  DATA = data;
  LAYOUT = LAYOUTS[data.format || 'portrait'];
  document.body.className = data.format || 'portrait';
  document.documentElement.style.width = LAYOUT.w + 'px';
  document.documentElement.style.height = LAYOUT.h + 'px';
  document.getElementById('issue').textContent = data.issue;
  const stage = document.getElementById('stage');
  await document.fonts.ready;
  SCENES = data.scenes.map(build);
  for (const s of SCENES) {
    stage.appendChild(s.el);
    s.el.style.display = 'flex';
    // Fit the biggest text to the stage once, before any transforms.
    for (const sel of ['.big', '.headline-card .hl', '.stat-num', '.stat-label', '.emoji-cap', '.vs-card .txt', '.meme .line', '.list .item']) {
      s.el.querySelectorAll(sel).forEach(e => fit(e, e.clientWidth || LAYOUT.stage.r - LAYOUT.stage.l, sel === '.headline-card .hl' ? LAYOUT.fitH * 0.85 : LAYOUT.fitH));
    }
    s.fitScale = 1; // reduced by __checkLayout if the scene spills
    s.el.style.display = 'none';
  }
  CHUNKS = buildCaptions(data.scenes.filter(s => s.visual.kind !== 'outro' && s.visual.kind !== 'intro'));
  return true;
};

window.__renderAt = (t) => {
  const total = DATA.total;
  let active = null;
  for (const s of SCENES) {
    const on = t >= s.scene.start && t < s.scene.end;
    s.el.style.display = on ? 'flex' : 'none';
    if (on) active = s;
  }
  if (!active && SCENES.length) active = SCENES[SCENES.length - 1], active.el.style.display = 'flex';
  if (active) {
    const lt = t - active.scene.start, D = active.scene.end - active.scene.start;
    active.update(lt, D);
    // Pop in, then a slow push-in for the rest of the beat.
    const pop = 0.94 + 0.06 * easeOutBack(lt / 0.18);
    active.el.style.transform = `scale(${pop * (1 + 0.04 * clamp(lt / D)) * active.fitScale})`;
    active.el.style.opacity = clamp(lt / 0.06);
    document.getElementById('flash').style.opacity = lt < 0.05 && active.scene.start > 0 ? 0.12 : 0;
  }
  document.querySelector('#progress > div').style.width = (clamp(t / total) * 100) + '%';

  const cap = document.getElementById('captions');
  // Latest chunk that has started (chunks overlap by the 0.08s linger).
  const ch = CHUNKS.findLast(c => t >= c.start && t < c.end + 0.08);
  cap.innerHTML = ch ? ch.words.map(w => `<span class="${t >= w.start && t < w.end + 0.02 ? 'on' : ''}">${esc(w.text)}</span>`).join(' ') : '';
  cap.style.fontSize = ch && ch.fontSize ? ch.fontSize + 'px' : '';
};

// ── Spill check ────────────────────────────────────────────────────

/** Effective opacity, walking up the tree (opacity multiplies). */
function opacityOf(el) {
  let o = 1;
  for (let e = el; e && e !== document.body; e = e.parentElement) o *= Number(getComputedStyle(e).opacity);
  return o;
}

/** Bounding box of all visible text under root (actual glyph extents, not element boxes). */
function textBox(root) {
  const box = { l: Infinity, t: Infinity, r: -Infinity, b: -Infinity };
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for (let n = walker.nextNode(); n; n = walker.nextNode()) {
    if (!n.textContent.trim() || opacityOf(n.parentElement) < 0.05) continue;
    const range = document.createRange();
    range.selectNodeContents(n);
    for (const r of range.getClientRects()) {
      if (r.width < 1 || r.height < 1) continue;
      // Fully off-frame text is an entrance animation, not a spill.
      if (r.right <= 0 || r.left >= LAYOUT.w || r.bottom <= 0 || r.top >= LAYOUT.h) continue;
      box.l = Math.min(box.l, r.left); box.t = Math.min(box.t, r.top);
      box.r = Math.max(box.r, r.right); box.b = Math.max(box.b, r.bottom);
    }
  }
  // Logos and icons can spill too.
  for (const g of root.querySelectorAll('svg')) {
    if (opacityOf(g) < 0.05) continue;
    const r = g.getBoundingClientRect();
    if (r.width < 1 || r.right <= 0 || r.left >= LAYOUT.w || r.bottom <= 0 || r.top >= LAYOUT.h) continue;
    box.l = Math.min(box.l, r.left); box.t = Math.min(box.t, r.top);
    box.r = Math.max(box.r, r.right); box.b = Math.max(box.b, r.bottom);
  }
  return box.l === Infinity ? null : box;
}

const inside = (b, s) => !b || (b.l >= s.l && b.t >= s.t && b.r <= s.r && b.b <= s.b);
const fmtBox = b => b ? `[${Math.round(b.l)},${Math.round(b.t)} -> ${Math.round(b.r)},${Math.round(b.b)}]` : 'none';

/**
 * For every scene, render its settled states (early, mid, and the very end,
 * where every item is revealed and the push-in is largest) and require all
 * visible text inside the stage safe area. A spilling scene is scaled down in
 * 4% steps (max 12). Caption chunks shrink their font the same way. Returns
 * what was adjusted and anything that still spills.
 */
window.__checkLayout = () => {
  const fixes = [], violations = [];
  SCENES.forEach((s, i) => {
    const D = s.scene.end - s.scene.start;
    const times = [s.scene.start + Math.min(1.2, D * 0.3), s.scene.start + D * 0.6, s.scene.end - 0.02];
    let tries = 0, bad = null;
    for (; tries <= 12; tries++) {
      bad = null;
      for (const t of times) {
        window.__renderAt(t);
        const b = textBox(s.el);
        if (!inside(b, LAYOUT.stage)) { bad = { t, b }; break; }
      }
      if (!bad) break;
      s.fitScale *= 0.96;
    }
    if (tries > 0 && !bad) fixes.push(`scene ${i + 1} (${s.scene.visual.kind}): scaled to ${(s.fitScale * 100).toFixed(0)}% to fit`);
    if (bad) violations.push(`scene ${i + 1} (${s.scene.visual.kind}) spills at t=${bad.t.toFixed(2)}: text ${fmtBox(bad.b)} vs safe ${fmtBox(LAYOUT.stage)}`);
  });

  const cap = document.getElementById('captions');
  CHUNKS.forEach(c => {
    window.__renderAt(c.start + 0.01);
    let fs = parseFloat(getComputedStyle(cap).fontSize), b = textBox(cap), shrunk = false;
    while (!inside(b, LAYOUT.caps) && fs > 30) {
      fs -= 4; c.fontSize = fs; shrunk = true;
      window.__renderAt(c.start + 0.01); b = textBox(cap);
    }
    const label = c.words.map(w => w.text).join(' ');
    if (shrunk && inside(b, LAYOUT.caps)) fixes.push(`caption "${label}": font ${fs}px`);
    if (!inside(b, LAYOUT.caps)) violations.push(`caption "${label}" spills: ${fmtBox(b)}`);
  });

  const hb = textBox(document.getElementById('header'));
  if (!inside(hb, LAYOUT.header)) violations.push(`header spills: ${fmtBox(hb)}`);
  return { fixes, violations };
};
</script>
