name: SEO Monitor

# Daily breakage check against production. Deliberately separate from the
# weekly digest workflow: this must never be able to interfere with a content
# build, and it runs on a different cadence.
on:
  schedule:
    # Every day at 07:00 UTC — an hour after the Sunday digest build, so on
    # Sundays it sees the freshly deployed site rather than the old one.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      test_alert:
        description: 'Send a test alert email instead of monitoring (verifies delivery end to end)'
        type: boolean
        default: false
      check_recovery_auth:
        description: 'Verify the Vercel token can list deployments (changes nothing)'
        type: boolean
        default: false
      check_repair_agent:
        description: 'Verify the repair agent (Claude Code + ANTHROPIC_API_KEY) runs in CI — one tiny call, ~$0.01'
        type: boolean
        default: false
      check_repair_pr:
        description: 'Verify repair can open a pull request (opens a draft PR, then closes it and deletes the branch)'
        type: boolean
        default: false

concurrency:
  group: seo-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Repair opens its fixes as pull requests with `gh pr create`. Without
      # this (and the repo setting "Allow GitHub Actions to create and approve
      # pull requests"), a verified fix would be pushed as a branch and the PR
      # step would fail with only a warning in the log.
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Recovery only ever runs when the site is already broken, so a token
      # that has expired or was scoped wrongly would be discovered during an
      # incident. This proves it works, on demand, without touching anything.
      - name: Verify Vercel credentials
        # A boolean input is a real boolean in `inputs`, so compare it as one.
        # `== 'true'` compares against a string, is never equal, and silently
        # skipped this step on its first run.
        if: inputs.check_recovery_auth == true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm i -g vercel@50
          npm run seo:recover -- --check-auth

      # Repair only runs on a day the site is broken, so a missing permission
      # would otherwise be discovered mid-incident. This exercises the exact
      # path repair uses — push a branch, `gh pr create` — then cleans up.
      - name: Verify repair can open a pull request
        if: inputs.check_repair_pr == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="seo-repair-pr-check-${{ github.run_id }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          # Always return to the original branch so later steps (which commit
          # monitor state to main) are unaffected, whatever happens below.
          trap 'git checkout - >/dev/null 2>&1 || true' EXIT
          git commit --allow-empty -m "seo: repair PR permission check (auto-closed)"
          git push -u origin "$branch"
          url=$(gh pr create --draft \
            --title "seo: repair PR permission check (auto-closed)" \
            --body "Opened by the SEO monitor's check_repair_pr input to prove the repair step can open pull requests. Closed automatically.")
          echo "Opened $url"
          gh pr close "$url" --delete-branch --comment "Permission check passed; closing automatically."
          echo "✅ Repair can open pull requests ($url, closed)" >> "$GITHUB_STEP_SUMMARY"

      # Same idea as the two checks around it: repair only runs during an
      # incident, so a missing CLI or a revoked/rotated API key would only be
      # discovered then. Installs exactly what the repair step installs and
      # makes one minimal call under a hard 5-cent cap.
      - name: Verify repair agent
        if: inputs.check_repair_agent == true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "✗ ANTHROPIC_API_KEY secret is not set." ; exit 1
          fi
          npm i -g @anthropic-ai/claude-code@2
          claude --version
          # `|| code=$?` so a failure still reaches the parser below and prints
          # its reason; under `bash -e` a failing $(...) ends the step silently.
          code=0
          out=$(claude -p "Reply with exactly: OK" --model haiku --max-budget-usd 0.05 --output-format json 2>&1) || code=$?
          if ! echo "$out" | node -e 'JSON.parse(require("fs").readFileSync(0,"utf8"))' 2>/dev/null; then
            echo "✗ Agent call failed (exit $code). Output:"; echo "$out" | head -20; exit 1
          fi
          echo "$out" | node -e '
            let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s);
              if (j.is_error) { console.error("✗ Agent call failed:", j.result); process.exit(1); }
              console.log("✓ Repair agent runs. Reply:", JSON.stringify(j.result), "cost $" + (j.total_cost_usd ?? 0).toFixed(4));
            });'
          echo "✅ Repair agent runs in CI" >> "$GITHUB_STEP_SUMMARY"

      - name: Run SEO monitor
        id: monitor
        # Capture the exit code rather than letting the step fail, because the
        # two failure modes need different handling and `outcome` collapses
        # them both to "failure":
        #   1 = the site has problems (expected; the email is the alert)
        #   2 = the monitor itself could not run (a real CI failure)
        env:
          SEO_BASE_URL: https://luxury-intel.com
          SEO_ALERT_EMAIL: ${{ secrets.SEO_ALERT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY_B64: ${{ secrets.GSC_PRIVATE_KEY_B64 }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          set +e
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            # On a healthy site the monitor never sends anything, so silence
            # proves nothing. This exercises the real delivery path in CI.
            npm run seo:monitor -- --test-alert
          else
            npm run seo:monitor
          fi
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "Monitor exited with code $code"

      # Recovery runs only when the monitor found problems. It decides for
      # itself whether those problems constitute an outage worth reverting for
      # — 3 of 8 sampled pages must fail — so a single broken page reaches
      # here and is correctly declined.
      - name: Recover from outage
        id: recover
        if: steps.monitor.outputs.exit_code == '1'
        env:
          SEO_BASE_URL: https://luxury-intel.com
          SEO_AGENT_AUTHORITY: ${{ vars.SEO_AGENT_AUTHORITY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SEO_ALERT_EMAIL: ${{ secrets.SEO_ALERT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          # The CLI is installed here rather than in a top-level step so the
          # daily healthy run doesn't pay for it. Pinned to a major version:
          # deployment listing parses the CLI's table output.
          npm i -g vercel@50
          set +e
          npm run seo:recover
          echo "recover_exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      # Repair attempts a code fix for defects the monitor found. Gated on
      # ANTHROPIC_API_KEY: without it the agent cannot run, and the step is
      # skipped rather than failing the job.
      - name: Repair code defects
        id: repair
        if: steps.monitor.outputs.exit_code == '1'
        env:
          SEO_BASE_URL: https://luxury-intel.com
          SEO_AGENT_AUTHORITY: ${{ vars.SEO_AGENT_AUTHORITY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # gh reads this to open the fix as a pull request.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GSC_CLIENT_EMAIL: ${{ secrets.GSC_CLIENT_EMAIL }}
          GSC_PRIVATE_KEY_B64: ${{ secrets.GSC_PRIVATE_KEY_B64 }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY — skipping automated repair."
            echo "The monitor's email alert is still the notification path."
            exit 0
          fi
          # The agent is the Claude Code CLI, spawned as `claude`. Without it
          # every attempt ended "agent-failed". Installed here, not up front,
          # so healthy days don't pay for it. Pinned to a major version: the
          # flags in seo/repair/agent.ts (--max-budget-usd, --output-format)
          # are part of its contract. It authenticates with ANTHROPIC_API_KEY.
          npm i -g @anthropic-ai/claude-code@2
          set +e
          npm run seo:repair
          echo "repair_exit=$?" >> "$GITHUB_OUTPUT"
          set -e


      - name: Persist SEO state
        # Three files, each of which only works if it survives between runs:
        #   monitor-state.json  makes alerts fire on transitions, not daily
        #   repair-ledger.json  the circuit breaker (2 attempts per finding)
        #   repair-spend.json   the rolling 30-day spend cap
        # Only these are ever committed by this workflow. `if: always()` so a
        # failed repair step can't skip it.
        if: always()
        run: |
          FILES="data/seo/monitor-state.json data/seo/repair-ledger.json data/seo/repair-spend.json"
          # A repair that crashed can leave its branch checked out. These files
          # are never touched by the agent, so carry them back to main.
          if [ "$(git rev-parse --abbrev-ref HEAD)" != "main" ]; then
            echo "Not on main after repair — returning to main with state files."
            git checkout main
          fi
          CHANGED=""
          for f in $FILES; do
            if [ -f "$f" ] && [ -n "$(git status --porcelain -- "$f")" ]; then CHANGED="$CHANGED $f"; fi
          done
          if [ -z "$CHANGED" ]; then
            echo "No state change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $CHANGED
          git commit -m "seo: update monitor state [skip ci]"
          git pull --rebase origin main
          git push

      - name: Report result
        run: |
          case "${{ steps.monitor.outputs.exit_code }}" in
            0) echo "✓ Site healthy" >> "$GITHUB_STEP_SUMMARY" ;;
            1) echo "⚠ SEO monitor reported problems — see the step log above." >> "$GITHUB_STEP_SUMMARY"
               echo "An email alert was sent if the problem set changed since the last run." >> "$GITHUB_STEP_SUMMARY" ;;
            *) echo "✗ The monitor itself failed to run." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Fail the job if the monitor itself errored
        # "Site is broken" is reported by email and leaves the job green — the
        # alert is the deliverable. "The monitor could not run" is a genuine CI
        # failure, because it means there is silently no monitoring at all.
        if: steps.monitor.outputs.exit_code != '0' && steps.monitor.outputs.exit_code != '1'
        run: |
          echo "Monitor exited with ${{ steps.monitor.outputs.exit_code }}"
          exit 1
