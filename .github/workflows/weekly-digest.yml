name: Weekly Digest Build

on:
  schedule:
    # Run every Sunday at 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    # Allow manual trigger
    inputs:
      send_email:
        description: 'Send the subscriber email. Set false when re-running a week whose email already went out (the send script has no idempotency check, and data/email/sent/ is gitignored, so a re-run would double-send).'
        type: boolean
        default: true

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  build-digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Node.js version
        id: node-version
        run: |
          if [ -f .nvmrc ]; then
            NODE_VERSION=$(cat .nvmrc | tr -d 'v')
            echo "version=$NODE_VERSION" >> $GITHUB_OUTPUT
            echo "Using Node version from .nvmrc: $NODE_VERSION"
          elif [ -f package.json ] && grep -q '"engines"' package.json; then
            # Extract node version from package.json engines using sed/grep
            NODE_VERSION=$(grep -o '"engines"[^}]*"node"[^"]*"[^"]*"' package.json | grep -o '[0-9]\+\.[0-9]\+' | head -1 || echo "20")
            echo "version=$NODE_VERSION" >> $GITHUB_OUTPUT
            echo "Using Node version from package.json engines: $NODE_VERSION"
          else
            echo "version=20" >> $GITHUB_OUTPUT
            echo "Using default Node version: 20"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Preflight env
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: npm run digest:preflight

      - name: Build weekly digest
        id: build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          SELECTION_MODEL: ${{ secrets.SELECTION_MODEL }}
          QUERY_DELTA_MODEL: ${{ secrets.QUERY_DELTA_MODEL }}
          EMAIL_DIGEST_MODEL: ${{ secrets.EMAIL_DIGEST_MODEL }}
          NODE_ENV: production
        run: npm run digest:weekly

      # Legacy fallback: write recipients.json from secret for runs where DATABASE_URL is absent.
      # When DATABASE_URL is set, the send script uses the DB instead and ignores this file.
      - name: Prepare email recipients file (legacy fallback)
        run: |
          mkdir -p data/email
          echo '${{ secrets.EMAIL_RECIPIENTS_JSON }}' > data/email/recipients.json

      - name: Send weekly email digest (dry-run unless enabled)
        # Scheduled runs always send. Manual runs send unless send_email=false.
        # Written as an event-name check because on a schedule the `inputs`
        # context is null, and GitHub casts null and false both to 0, so
        # `inputs.send_email != false` would wrongly skip the weekly send.
        if: github.event_name != 'workflow_dispatch' || inputs.send_email
        env:
          EMAIL_SEND_ENABLED: ${{ vars.EMAIL_SEND_ENABLED }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # DB-driven recipients (preferred over recipients.json when set)
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UNSUBSCRIBE_SECRET: ${{ secrets.UNSUBSCRIBE_SECRET }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: npm run email:weekly

      - name: Run competitor analysis
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run competitor:analyze

      # Commit only when the "Build weekly digest" step SUCCEEDED. That step is
      # the gate: it now exits 1 not just on a missing digest but also when the
      # content-quality gate fails (no AI summaries or no cover image), so a
      # hollow digest is never committed or deployed. A later partial failure
      # (email send, competitor analysis) still lets the good digest commit,
      # because those are separate steps and the build outcome stays 'success'.
      - name: Check for changes
        if: steps.build.outcome == 'success'
        id: check-changes
        run: |
          git status --porcelain -uall > /tmp/changes.txt
          if [ ! -s /tmp/changes.txt ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No digest changes; nothing to commit"
            exit 0
          fi
          
          # Check if changes are only in allowed directories:
          # - data/digests/ (digest JSON files)
          # - data/weeks/*/health.json (health reports)
          # - data/articles.json (updated by RSS/page ingestion)
          # - data/source_yield.json (yield report)
          # - data/weeks/{week}/*.{json,txt} (podcast.json, email-digest.json, scripts)
          #   NOT the discovery/, podcast/, podcast-temp/ or video/ subdirs:
          #   those are gitignored pipeline caches (~327 MB) that would
          #   otherwise ship in every Vercel deployment.
          # - public/podcast/ (podcast audio files)
          # - public/weekly-images/ (cover images)
          # - data/cache/ (cache files for translations, reranking, etc.)
          # - data/page_source_stats.json (page ingestion stats)
          # - data/competitor-intel.json (competitor intelligence, updated weekly)
          # -uall is required: without it git collapses a wholly-untracked
          # directory (a brand-new data/weeks/<week>/) into a single "dir/"
          # entry, which no file-level pattern below can match. cut -c4- keeps
          # paths with spaces intact, unlike awk '{print $2}'.
          CHANGED_FILES=$(git status --porcelain -uall | cut -c4-)
          # Pattern matches:
          # - data/digests/*.json
          # - data/weeks/*/health.json
          # - data/articles.json
          # - data/source_yield.json
          # - data/page_source_stats.json
          # - data/competitor-intel.json
          # - data/weeks/*/*.{json,txt} (top level only, not cache subdirs)
          # - public/podcast/*.mp3
          # - public/weekly-images/*.png
          # - data/cache/ (any files under cache directory)
          ALLOWED_PATTERN="^(data/digests/|data/weeks/[^/]+/health\.json|data/articles\.json|data/source_yield\.json|data/page_source_stats\.json|data/competitor-intel\.json|data/stock-history\.json|data/weeks/[^/]+/[^/]+\.(json|txt)|public/podcast/[^/]+\.mp3|public/weekly-images/[^/]+\.png|data/cache/.*)"
          NON_ALLOWED_CHANGES=$(echo "$CHANGED_FILES" | grep -vE "$ALLOWED_PATTERN" || true)
          
          if [ -n "$NON_ALLOWED_CHANGES" ]; then
            echo "❌ Error: Changes detected outside allowed directories:"
            echo "$NON_ALLOWED_CHANGES"
            echo ""
            echo "This workflow only commits changes to:"
            echo "  - data/digests/ (digest JSON files)"
            echo "  - data/weeks/*/health.json (health reports)"
            echo "  - data/articles.json (article database)"
            echo "  - data/source_yield.json (source yield report)"
            echo "  - data/page_source_stats.json (page ingestion stats)"
            echo "  - data/competitor-intel.json (competitor intelligence)"
            echo "  - data/stock-history.json (stock price history)"
            echo "  - data/weeks/{week}/*.{json,txt} (podcast.json, email-digest.json, scripts)"
            echo "  - public/podcast/ (podcast audio files)"
            echo "  - public/weekly-images/ (cover images)"
            echo "  - data/cache/ (cache files)"
            exit 1
          fi
          
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "Changes detected in allowed directories"

      - name: Configure Git
        if: steps.build.outcome == 'success' && steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and push changes
        if: steps.build.outcome == 'success' && steps.check-changes.outputs.has_changes == 'true'
        run: |
          git add data/digests/ data/weeks/*/health.json data/articles.json data/source_yield.json data/page_source_stats.json data/competitor-intel.json data/stock-history.json data/weeks/*/*.json data/weeks/*/*.txt public/podcast/*.mp3 public/weekly-images/*.png data/cache/
          if git diff --staged --quiet; then
            echo "No staged changes to commit"
            exit 0
          fi
          COMMIT_DATE=$(date -u +%Y-%m-%d)
          git commit -m "Weekly digest: $COMMIT_DATE"
          # Pull and rebase in case commits landed on main while the pipeline was running
          git pull --rebase origin main
          git push

      - name: Generate run summary
        if: always()
        run: |
          SUMMARY_FILE="/tmp/run-summary.txt"
          echo "Weekly Digest Build Summary" > "$SUMMARY_FILE"
          echo "===========================" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          echo "Run Date: $(date -u +%Y-%m-%d\ %H:%M:%S\ UTC)" >> "$SUMMARY_FILE"
          echo "" >> "$SUMMARY_FILE"
          
          # Detect week labels from digest files
          if [ -d data/digests ]; then
            echo "Detected Digest Files:" >> "$SUMMARY_FILE"
            ls -1 data/digests/*.json 2>/dev/null | xargs -I {} basename {} .json | sort -r | head -5 >> "$SUMMARY_FILE" || echo "No digest files found" >> "$SUMMARY_FILE"
          fi
          
          echo "" >> "$SUMMARY_FILE"
          echo "Git Status:" >> "$SUMMARY_FILE"
          git status --short >> "$SUMMARY_FILE" || echo "No changes" >> "$SUMMARY_FILE"
          
          echo "" >> "$SUMMARY_FILE"
          echo "Git Diff Stats:" >> "$SUMMARY_FILE"
          git diff --stat HEAD >> "$SUMMARY_FILE" || echo "No diff" >> "$SUMMARY_FILE"
          
          cat "$SUMMARY_FILE"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-digest-${{ github.run_number }}
          path: |
            data/digests/*.json
            /tmp/run-summary.txt
          retention-days: 30
