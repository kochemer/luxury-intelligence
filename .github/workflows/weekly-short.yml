name: Weekly Short

# Renders the week's 60-second vertical Short and uploads it to YouTube
# (@luxury-intel) after the Monday digest build. See video-short/README.md.
#
# Commits only data/weeks/<week>/video.json and public/video/shorts/<week>.jpg
# (~30 KB). The MP4 is never committed: it lives on YouTube (Vercel storage).
# Until the YouTube API audit passes, uploads land private and the site keeps
# them hidden; `sync` (run first every time) flips a record once its video is public.

on:
  workflow_run:
    workflows: ['Weekly Digest Build']
    types: [completed]
  workflow_dispatch:
    inputs:
      week:
        description: 'Week to render + upload (e.g. 2026-W42). Empty = latest digest.'
        required: false
      sync_only:
        description: 'Only re-check uploaded videos and publish newly-public ones on the site'
        type: boolean
        default: false

concurrency:
  group: weekly-short
  cancel-in-progress: false

jobs:
  short:
    # A skipped digest run (already built) also "succeeds"; upload.ts then
    # skips the week because its video.json already has an id.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix video-short

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-color-emoji

      - name: Pick week
        id: week
        run: |
          WEEK="${{ inputs.week }}"
          if [ -z "$WEEK" ]; then WEEK=$(ls data/digests | grep -E '^[0-9]{4}-W[0-9]{2}\.json$' | sort | tail -1 | sed 's/\.json$//'); fi
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "Week: $WEEK"

      # Story, script, voice clips and the spend ledger survive a re-run, so a
      # retry reuses paid work and the $2/week cap holds across attempts.
      - name: Restore video-short work dir
        uses: actions/cache/restore@v4
        with:
          path: data/weeks/${{ steps.week.outputs.week }}/video-short
          key: video-short-${{ steps.week.outputs.week }}-${{ github.run_id }}
          restore-keys: video-short-${{ steps.week.outputs.week }}-

      - name: Sync earlier uploads
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: npx tsx video-short/src/upload.ts --sync

      - name: Check whether this week is already uploaded
        id: done
        if: ${{ !inputs.sync_only }}
        run: |
          F="data/weeks/${{ steps.week.outputs.week }}/video.json"
          if [ -f "$F" ] && grep -q '"youtubeId": "' "$F"; then echo "uploaded=true" >> "$GITHUB_OUTPUT"; else echo "uploaded=false" >> "$GITHUB_OUTPUT"; fi

      - name: Render Short (vertical)
        if: ${{ !inputs.sync_only && steps.done.outputs.uploaded == 'false' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npx tsx video-short/src/run.ts --week=${{ steps.week.outputs.week }} --formats=vertical

      - name: Save video-short work dir
        if: ${{ always() && !inputs.sync_only && steps.done.outputs.uploaded == 'false' }}
        uses: actions/cache/save@v4
        with:
          path: data/weeks/${{ steps.week.outputs.week }}/video-short
          key: video-short-${{ steps.week.outputs.week }}-${{ github.run_id }}

      - name: Upload to YouTube
        if: ${{ !inputs.sync_only && steps.done.outputs.uploaded == 'false' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          SEO_ALERT_EMAIL: ${{ secrets.SEO_ALERT_EMAIL }}
        run: npx tsx video-short/src/upload.ts --week=${{ steps.week.outputs.week }}

      - name: Commit record + poster
        run: |
          CHANGED=$(git status --porcelain -uall | cut -c4-)
          if [ -z "$CHANGED" ]; then echo "Nothing to commit"; exit 0; fi
          BAD=$(echo "$CHANGED" | grep -vE '^(data/weeks/[^/]+/video\.json|public/video/shorts/[^/]+\.jpg)$' || true)
          if [ -n "$BAD" ]; then echo "Refusing to commit unexpected files:"; echo "$BAD"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- data/weeks/*/video.json public/video/shorts/
          git commit -m "Weekly Short: ${{ steps.week.outputs.week }} video record" -m "Docs-Skip: generated data, no code change"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
