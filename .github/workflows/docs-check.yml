name: Docs check

# Fails when the docs no longer match the code (env vars, scripts, routes,
# tables, workflows, doc map, cited paths). See docs/README.md §6.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/checkDocs.mjs
