name: Subscriber sweep

# Nightly cleanup of abandoned checkouts: planType='none' rows older than 24h
# with no Stripe subscription are promoted to 'free' (if they opted into the
# digest) or deleted. See scripts/sweepStaleSubscribers.ts.

on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only, change nothing'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Sweep stale subscribers
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx tsx scripts/sweepStaleSubscribers.ts ${{ inputs.dry_run && '--dry-run' || '' }}
